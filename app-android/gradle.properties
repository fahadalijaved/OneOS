# Shared build server (~12 GB RAM, another user builds too): keep the Gradle
# daemon at 2 GB heap and at most 3 workers. Kotlin compiles inside the Gradle
# daemon (no second 2 GB Kotlin daemon next to it).
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.workers.max=3
org.gradle.parallel=true
org.gradle.caching=true
kotlin.compiler.execution.strategy=in-process
kotlin.code.style=official

# JDK 21 toolchain comes from the machine (/usr/lib/jvm on the server); never
# download one.
org.gradle.java.installations.auto-download=false

android.useAndroidX=true

# SESL picker modules intentionally share the androidx.picker namespace (as in Twidget).
android.uniquePackageNames=false
